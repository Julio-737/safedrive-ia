<div class="mobile-container">
  <header class="app-header mb-3">
    <h2>Historial de alertas</h2>
    <p class="text-muted">Registro de eventos de fatiga detectados</p>
  </header>

  <!-- Tarjetas KPI Horizontales como el diseño original -->
  <div class="d-flex justify-content-between my-3 gap-2 text-center" style="display: flex; gap: 8px;">
    <div class="turn-summary-card flex-fill p-2" style="flex: 1; background: #132238; border-radius: 12px; padding: 12px;">
      <h3 id="cntHoy" style="color: #ef4444; margin: 0; font-size: 1.5rem;">0</h3>
      <small class="text-muted" style="font-size: 0.75rem;">HOY</small>
    </div>
    <div class="turn-summary-card flex-fill p-2" style="flex: 1; background: #132238; border-radius: 12px; padding: 12px;">
      <h3 id="cntSemana" style="color: #3b82f6; margin: 0; font-size: 1.5rem;">0</h3>
      <small class="text-muted" style="font-size: 0.75rem;">ESTA SEMANA</small>
    </div>
    <div class="turn-summary-card flex-fill p-2" style="flex: 1; background: #132238; border-radius: 12px; padding: 12px;">
      <h3 id="cntProm" style="color: #10b981; margin: 0; font-size: 1.5rem;">1.5s</h3>
      <small class="text-muted" style="font-size: 0.75rem;">REACCIÓN PROM.</small>
    </div>
  </div>

  <!-- Contenedor dinámico de lista -->
  <div id="listaAlertasConductor" class="d-flex flex-column gap-2 my-3" style="display: flex; flex-direction: column; gap: 10px;">
    <p class="text-muted text-center py-4">Cargando historial...</p>
  </div>

  <button id="btnBackToMonitoreo" class="btn-primary w-100 mt-4" style="width: 100%; padding: 12px; margin-top: 15px;">
    ← Volver a Monitoreo en Vivo
  </button>
</div>
