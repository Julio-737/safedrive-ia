<div class="mobile-container">
  <header class="app-header mb-3">
    <h2 class="h5 font-weight-bold mb-1" style="color: #f8fafc;">Historial de alertas</h2>
    <p class="text-muted small mb-0">Registro de eventos de fatiga detectados</p>
  </header>

  <!-- Tarjetas KPI Horizontales con diseño original -->
  <div class="d-flex justify-content-between my-3 gap-2 text-center">
    <div class="turn-summary-card flex-fill p-2">
      <h3 id="cntHoy" style="color: #ef4444; margin: 0; font-size: 1.5rem; font-weight: bold;">0</h3>
      <small class="text-muted" style="font-size: 0.75rem;">HOY</small>
    </div>
    <div class="turn-summary-card flex-fill p-2">
      <h3 id="cntSemana" style="color: #38bdf8; margin: 0; font-size: 1.5rem; font-weight: bold;">0</h3>
      <small class="text-muted" style="font-size: 0.75rem;">ESTA SEMANA</small>
    </div>
    <div class="turn-summary-card flex-fill p-2">
      <h3 id="cntProm" style="color: #10b981; margin: 0; font-size: 1.5rem; font-weight: bold;">1.5s</h3>
      <small class="text-muted" style="font-size: 0.75rem;">REACCIÓN PROM.</small>
    </div>
  </div>

  <!-- Contenedor dinámico de lista -->
  <div id="listaAlertasConductor" class="d-flex flex-column gap-2 my-3">
    <p class="text-muted text-center py-4">Cargando historial...</p>
  </div>

  <button id="btnBackToMonitoreo" class="btn btn-primary w-100 py-2 mt-4" style="width: 100%; border-radius: 8px;">
    ← Volver a Monitoreo en Vivo
  </button>
</div>
