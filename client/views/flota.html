<div class="supervisor-layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">🚌</span>
      <h2>SafeDrive IA</h2>
    </div>
    <nav class="nav-menu">
      <a href="#" id="menuDash" class="nav-item">📊 Panel General</a>
      <a href="#" id="menuFlota" class="nav-item active">🚐 Unidades / Flota</a>
      <a href="#" id="menuReportes" class="nav-item">📈 Reportes</a>
      <a href="#" id="menuCentroIa" class="nav-item">⚡ Centro IA</a>
    </nav>
    <button id="btnSupervisorLogout" class="btn-logout">Cerrar Sesión</button>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div>
        <h1>Unidades / Flota (<span id="flotaTotal">0</span> registradas)</h1>
        <span id="connStatus" class="conn-status">● Conectando...</span>
      </div>
      <button id="btnNuevaUnidad" class="btn-primary">+ Registrar Unidad</button>
    </div>

    <div class="units-grid" id="unitsGrid">
      <p class="text-muted">Cargando unidades desde la base de datos...</p>
    </div>
  </main>

  <dialog id="dlgUnidad" class="dlg-unidad">
    <form id="formUnidad">
      <h3>Registrar unidad</h3>
      <label for="inCodigo">CÓDIGO DE LA UNIDAD</label>
      <input id="inCodigo" type="text" placeholder="Ej. 302-F" maxlength="20" required />
      <label for="inPlaca">PLACA</label>
      <input id="inPlaca" type="text" placeholder="Ej. B8A-710" maxlength="10" required />
      <p class="dlg-error" id="dlgError"></p>
      <div class="dlg-actions">
        <button type="button" id="btnCancelarUnidad" class="btn-sm btn-sec">Cancelar</button>
        <button type="submit" class="btn-sm">Guardar</button>
      </div>
    </form>
  </dialog>
</div>
