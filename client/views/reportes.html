<div class="supervisor-layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">🚌</span>
      <h2>SafeDrive IA</h2>
    </div>
    <nav class="nav-menu">
      <a href="#" id="menuDash" class="nav-item">📊 Panel General</a>
      <a href="#" id="menuFlota" class="nav-item">🚐 Unidades / Flota</a>
      <a href="#" id="menuReportes" class="nav-item active">📈 Reportes</a>
      <a href="#" id="menuCentroIa" class="nav-item">⚡ Centro IA</a>
    </nav>
    <button id="btnSupervisorLogout" class="btn-logout">Cerrar Sesión</button>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div>
        <h1>Reportes y Estadísticas de Flota</h1>
        <span id="connStatus" class="conn-status">● Conectando...</span>
      </div>
      <div class="btn-group">
        <button id="btnSemana" class="btn-sm active">Semana</button>
        <button id="btnMes" class="btn-sm">Mes</button>
        <button id="btnExportar" class="btn-sm btn-sec">⬇ Exportar CSV</button>
      </div>
    </div>

    <div class="dashboard-split">
      <div class="panel-box">
        <h3 id="repTitulo">Alertas por Día (Últimos 7 días)</h3>
        <div class="bar-chart-mock" id="repBars"></div>
        <small class="text-muted mt-2" id="repResumen" style="display:block;">Cargando...</small>
      </div>

      <div class="panel-box">
        <h3>Tipos de Eventos</h3>
        <ul class="activity-feed" id="repTipos">
          <li class="feed-empty">Cargando...</li>
        </ul>
      </div>
    </div>

    <div class="dashboard-split split-even mt-2">
      <div class="panel-box">
        <h3>Unidades con más alertas</h3>
        <div id="repUnidades"></div>
      </div>
      <div class="panel-box">
        <h3>Conductores con más alertas</h3>
        <div id="repConductores"></div>
      </div>
    </div>
  </main>
</div>
